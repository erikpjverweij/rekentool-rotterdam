<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekentool meerderheid Rotterdam 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #fafafa;
      color: #1a1a2e;
      min-height: 100vh;
    }
    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 28px; }
    .meter-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .zetel-count {
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
      transition: color 0.3s;
    }
    .status-text {
      font-size: 14px;
      font-weight: 600;
      transition: color 0.3s;
    }
    .bar-wrapper {
      position: relative;
      height: 32px;
      border-radius: 8px;
      background: #e8e8ee;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 8px;
      transition: width 0.35s ease, background 0.3s;
    }
    .meerderheid-lijn {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: #1a1a2e;
      opacity: 0.6;
    }
    .meerderheid-label {
      position: absolute;
      top: -20px;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 600;
      color: #666;
    }
    .kleur-balk {
      display: flex;
      gap: 2px;
      margin-top: 12px;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .kleur-segment {
      transition: flex 0.3s;
      border-radius: 2px;
    }
    .partij-lijst { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .partij-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 8px;
      border: 2px solid transparent;
      background: #f5f5f7;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .partij-btn:hover { filter: brightness(0.97); }
    .partij-btn.actief { background: var(--kleur-light); border-color: var(--kleur); }
    .partij-links { display: flex; align-items: center; gap: 10px; }
    .partij-blokje {
      width: 14px; height: 14px;
      border-radius: 3px;
      background: #ccc;
      transition: background-color 0.15s;
      flex-shrink: 0;
    }
    .partij-btn.actief .partij-blokje { background: var(--kleur); }
    .partij-naam { font-size: 15px; font-weight: 400; }
    .partij-btn.actief .partij-naam { font-weight: 600; }
    .partij-zetels {
      font-size: 14px; font-weight: 600;
      color: #999; min-width: 50px; text-align: right;
    }
    .partij-btn.actief .partij-zetels { color: var(--kleur); }
    .samenvatting {
      margin-top: 24px;
      padding: 14px 16px;
      border-radius: 8px;
      display: none;
    }
    .samenvatting.zichtbaar { display: block; }
    .samenvatting.meerderheid { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .samenvatting.geen-meerderheid { background: #fefce8; border: 1px solid #fef08a; }
    .samenvatting-titel { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .samenvatting.meerderheid .samenvatting-titel { color: #166534; }
    .samenvatting.geen-meerderheid .samenvatting-titel { color: #854d0e; }
    .samenvatting-lijst { font-size: 13px; color: #444; line-height: 1.5; }
    .reset-btn {
      margin-top: 16px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #ccc;
      background: transparent;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: default;
      transition: color 0.15s;
    }
    .reset-btn.actief { color: #666; cursor: pointer; }
    .reset-btn.actief:hover { color: #333; border-color: #bbb; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Rekentool meerderheid Rotterdam</h1>
    <p class="subtitle">Gemeenteraad 2026 \u2014 45 zetels, meerderheid: 23</p>
    <div style="margin-bottom: 28px;">
      <div class="meter-header">
        <span class="zetel-count" id="zetelCount">0</span>
        <span class="status-text" id="statusText" style="color: #dc2626;">23 tekort</span>
      </div>
      <div class="bar-wrapper">
        <div class="bar-fill" id="barFill" style="width: 0%; background: linear-gradient(90deg, #f97316, #fb923c);"></div>
        <div class="meerderheid-lijn" style="left: 51.11%;"></div>
        <span class="meerderheid-label" style="left: 51.11%;">23</span>
      </div>
      <div class="kleur-balk" id="kleurBalk"></div>
    </div>
    <div class="partij-lijst" id="partijLijst"></div>
    <div class="samenvatting" id="samenvatting">
      <p class="samenvatting-titel" id="samenvattingTitel"></p>
      <p class="samenvatting-lijst" id="samenvattingLijst"></p>
    </div>
    <button class="reset-btn" id="resetBtn" onclick="resetAlles()">Reset selectie</button>
  </div>
  <script>
    const partijen = [
      { naam: "GroenLinks-PvdA", zetels: 11, kleur: "#e5243b" },
      { naam: "Leefbaar Rotterdam", zetels: 11, kleur: "#1e3a5f" },
      { naam: "D66", zetels: 5, kleur: "#01a651" },
      { naam: "VVD", zetels: 5, kleur: "#ff7f00" },
      { naam: "DENK", zetels: 4, kleur: "#00a1c9" },
      { naam: "FvD", zetels: 2, kleur: "#8b1a2d" },
      { naam: "CDA", zetels: 1, kleur: "#007b5f" },
      { naam: "PvdD", zetels: 1, kleur: "#006c2e" },
      { naam: "Volt", zetels: 1, kleur: "#502379" },
      { naam: "50PLUS", zetels: 1, kleur: "#93328e" },
      { naam: "ChristenUnie", zetels: 1, kleur: "#00a1de" },
      { naam: "SP", zetels: 1, kleur: "#ee2e22" },
      { naam: "BIJ1", zetels: 1, kleur: "#ffff00" },
    ];
    const TOTAAL = 45;
    const MEERDERHEID = 23;
    const geselecteerd = new Set();
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";
    }
    function renderPartijen() {
      const lijst = document.getElementById("partijLijst");
      lijst.innerHTML = "";
      partijen.forEach(function(p, i) {
        const btn = document.createElement("button");
        btn.className = "partij-btn";
        btn.style.setProperty("--kleur", p.kleur);
        btn.style.setProperty("--kleur-light", hexToRgba(p.kleur, 0.08));
        btn.innerHTML = '<div class="partij-links"><div class="partij-blokje"></div><span class="partij-naam">' + p.naam + '</span></div><span class="partij-zetels">' + p.zetels + ' ' + (p.zetels === 1 ? "zetel" : "zetels") + '</span>';
        btn.addEventListener("click", function() { toggle(p.naam); });
        btn.id = "partij-" + i;
        lijst.appendChild(btn);
      });
    }
    function toggle(naam) {
      if (geselecteerd.has(naam)) geselecteerd.delete(naam);
      else geselecteerd.add(naam);
      update();
    }
    function resetAlles() {
      geselecteerd.clear();
      update();
    }
    function update() {
      const totaalZetels = partijen.filter(function(p) { return geselecteerd.has(p.naam); }).reduce(function(sum, p) { return sum + p.zetels; }, 0);
      const percentage = (totaalZetels / TOTAAL) * 100;
      const meerderheid = totaalZetels >= MEERDERHEID;
      document.getElementById("zetelCount").textContent = totaalZetels;
      document.getElementById("zetelCount").style.color = meerderheid ? "#16a34a" : "#1a1a2e";
      const statusEl = document.getElementById("statusText");
      if (meerderheid) {
        statusEl.textContent = "\u2713 Meerderheid (" + (totaalZetels - MEERDERHEID + 1) + " over)";
        statusEl.style.color = "#16a34a";
      } else {
        statusEl.textContent = (MEERDERHEID - totaalZetels) + " tekort";
        statusEl.style.color = "#dc2626";
      }
      const bar = document.getElementById("barFill");
      bar.style.width = Math.min(percentage, 100) + "%";
      bar.style.background = meerderheid ? "linear-gradient(90deg, #16a34a, #22c55e)" : "linear-gradient(90deg, #f97316, #fb923c)";
      const kleurBalk = document.getElementById("kleurBalk");
      kleurBalk.innerHTML = "";
      partijen.filter(function(p) { return geselecteerd.has(p.naam); }).forEach(function(p) {
        const seg = document.createElement("div");
        seg.className = "kleur-segment";
        seg.style.flex = p.zetels;
        seg.style.background = p.kleur;
        seg.title = p.naam + ": " + p.zetels;
        kleurBalk.appendChild(seg);
      });
      partijen.forEach(function(p, i) {
        const btn = document.getElementById("partij-" + i);
        if (geselecteerd.has(p.naam)) btn.classList.add("actief");
        else btn.classList.remove("actief");
      });
      const samEl = document.getElementById("samenvatting");
      const gp = partijen.filter(function(p) { return geselecteerd.has(p.naam); });
      if (gp.length > 0) {
        samEl.classList.add("zichtbaar");
        samEl.classList.toggle("meerderheid", meerderheid);
        samEl.classList.toggle("geen-meerderheid", !meerderheid);
        document.getElementById("samenvattingTitel").textContent = (meerderheid ? "Coalitie" : "Selectie") + " (" + gp.length + " " + (gp.length === 1 ? "partij" : "partijen") + ")";
        document.getElementById("samenvattingLijst").textContent = gp.map(function(p) { return p.naam; }).join(", ");
      } else {
        samEl.classList.remove("zichtbaar");
      }
      const resetBtn = document.getElementById("resetBtn");
      if (geselecteerd.size > 0) resetBtn.classList.add("actief");
      else resetBtn.classList.remove("actief");
    }
    renderPartijen();
    update();
  </script>
</body>
</html>
